services:
  tracker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: device-location-tracker
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=UTC
      - DATA_DIR=/data
      - DATABASE_PATH=/data/tracker.db
    volumes:
      - tracker_data:/data
      - ${GOOGLE_SECRETS_PATH:-./Auth/secrets.json}:/app/Auth/secrets.json

volumes:
  tracker_data:
    name: tracker_sqlite_data
